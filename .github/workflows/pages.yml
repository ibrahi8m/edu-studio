# Publishes the web version (PWA) to GitHub Pages.
# It deploys the committed dist/ folder as it is — the exact build that passed the
# tests — instead of rebuilding it on GitHub. To publish a new version: build and
# test locally (npm run build && npm run test:e2e), commit dist/, push to main.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the build is there and offline-only
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          ! grep -RIlE "https?://(fonts\.googleapis|cdn\.|unpkg|jsdelivr)" dist || (echo "external reference found" && exit 1)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
