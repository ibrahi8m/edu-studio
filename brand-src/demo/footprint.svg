<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#F4F7FB"/>
  <circle cx="480" cy="270" r="230" fill="#E3ECFA"/>
  <!-- trail of footprints made of data dots -->
  <g fill="#2563EB">
    <g transform="translate(150 420) rotate(-20)"><ellipse cx="0" cy="0" rx="26" ry="40"/><circle cx="-14" cy="-52" r="8"/><circle cx="2" cy="-58" r="8"/><circle cx="18" cy="-52" r="8"/></g>
    <g transform="translate(260 330) rotate(-10)" opacity="0.9"><ellipse cx="0" cy="0" rx="26" ry="40"/><circle cx="-14" cy="-52" r="8"/><circle cx="2" cy="-58" r="8"/><circle cx="18" cy="-52" r="8"/></g>
    <g transform="translate(380 290) rotate(5)" opacity="0.8"><ellipse cx="0" cy="0" rx="26" ry="40"/><circle cx="-14" cy="-52" r="8"/><circle cx="2" cy="-58" r="8"/><circle cx="18" cy="-52" r="8"/></g>
    <g transform="translate(500 230) rotate(12)" opacity="0.7"><ellipse cx="0" cy="0" rx="26" ry="40"/><circle cx="-14" cy="-52" r="8"/><circle cx="2" cy="-58" r="8"/><circle cx="18" cy="-52" r="8"/></g>
    <g transform="translate(620 190) rotate(20)" opacity="0.55"><ellipse cx="0" cy="0" rx="26" ry="40"/><circle cx="-14" cy="-52" r="8"/><circle cx="2" cy="-58" r="8"/><circle cx="18" cy="-52" r="8"/></g>
  </g>
  <!-- devices that collect the trail -->
  <g transform="translate(700 70)"><rect width="190" height="120" rx="12" fill="#1E242C"/><rect x="12" y="12" width="166" height="86" rx="6" fill="#5B9BFF"/><rect x="-20" y="120" width="230" height="14" rx="7" fill="#5D6673"/></g>
  <g transform="translate(740 300)"><rect width="80" height="140" rx="16" fill="#1E242C"/><rect x="9" y="16" width="62" height="98" rx="6" fill="#5B9BFF"/></g>
  <g fill="none" stroke="#9AA3AF" stroke-width="5" stroke-dasharray="4 12" stroke-linecap="round"><path d="M640 180 C680 160 690 150 700 140"/><path d="M640 200 C700 250 720 290 740 320"/></g>
  <!-- eye: someone is watching -->
  <g transform="translate(110 110)"><path d="M0 40 Q60 -10 120 40 Q60 90 0 40 Z" fill="#FFFFFF" stroke="#5D6673" stroke-width="6"/><circle cx="60" cy="40" r="20" fill="#2563EB"/><circle cx="60" cy="40" r="8" fill="#1E242C"/></g>
</svg>
