<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F4F7"/>
      <stop offset="0.45" stop-color="#A9B1BC"/>
      <stop offset="1" stop-color="#5D6673"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262C35"/>
      <stop offset="1" stop-color="#14181E"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D6E6FF"/>
      <stop offset="0.45" stop-color="#5B9BFF"/>
      <stop offset="1" stop-color="#2F7BFF"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0E1014"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#silver)" stroke-opacity="0.35" stroke-width="4"/>
  <!-- antenna -->
  <line x1="256" y1="100" x2="256" y2="140" stroke="url(#silver)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="86" r="26" fill="#2F7BFF" filter="url(#glow)" opacity="0.8"/>
  <circle cx="256" cy="86" r="17" fill="url(#eye)"/>
  <!-- ears -->
  <rect x="90" y="222" width="30" height="76" rx="12" fill="url(#silver)"/>
  <rect x="392" y="222" width="30" height="76" rx="12" fill="url(#silver)"/>
  <!-- helmet -->
  <rect x="120" y="140" width="272" height="236" rx="92" fill="url(#shell)" stroke="url(#silver)" stroke-width="12"/>
  <!-- visor -->
  <rect x="158" y="206" width="196" height="100" rx="50" fill="#06080B" stroke="#2F7BFF" stroke-opacity="0.55" stroke-width="4"/>
  <!-- eyes -->
  <circle cx="212" cy="256" r="30" fill="#2F7BFF" filter="url(#glow)" opacity="0.85"/>
  <circle cx="300" cy="256" r="30" fill="#2F7BFF" filter="url(#glow)" opacity="0.85"/>
  <circle cx="212" cy="256" r="20" fill="url(#eye)"/>
  <circle cx="300" cy="256" r="20" fill="url(#eye)"/>
  <!-- circuit chin: an "8" loop -->
  <circle cx="256" cy="338" r="12" fill="none" stroke="#2F7BFF" stroke-width="6"/>
  <circle cx="256" cy="362" r="12" fill="none" stroke="#2F7BFF" stroke-width="6"/>
  <line x1="196" y1="350" x2="236" y2="350" stroke="url(#silver)" stroke-width="5" stroke-linecap="round"/>
  <line x1="276" y1="350" x2="316" y2="350" stroke="url(#silver)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="192" cy="350" r="6" fill="#A9B1BC"/>
  <circle cx="320" cy="350" r="6" fill="#A9B1BC"/>
  <!-- base -->
  <rect x="196" y="400" width="120" height="16" rx="8" fill="url(#silver)" opacity="0.8"/>
</svg>
